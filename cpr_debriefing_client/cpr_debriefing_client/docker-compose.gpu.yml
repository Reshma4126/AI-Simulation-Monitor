# docker-compose.gpu.yml — GPU override (layered on top of docker-compose.yml)
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Requires: NVIDIA GPU + Docker Desktop with WSL2 backend + NVIDIA Container Toolkit

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
